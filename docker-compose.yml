services:
  master-node:
    build:
      context: . # directory from which we build
      dockerfile: Dockerfile.master
    ports:
      - "60000:60000"
    tty: true
    volumes:
      - shared_logs:/app/data:ro
    depends_on:
      log-generator:
        condition: service_healthy

  # log generator
  log-generator:
    image: alpine:latest
    volumes:
      - shared_logs:/var/log/app_logs
    command: >
      /bin/sh -c '
      rm -f /var/log/app_logs/sample.log.ready &&
      rm -f /var/log/app_logs/sample.log &&
      echo "Generating text file for LogGrid..." &&
      mkdir -p /var/log/app_logs &&
      for i in $$(seq 1 5000); do 
        echo "[ $$(date -Iseconds) ] [INFO] Line $$i: Processing user data..." >> /var/log/app_logs/sample.log; 
      done &&
      touch /var/log/app_logs/sample.log.ready &&
      echo "File ready!" &&
      tail -f /dev/null'
    healthcheck:
      test: ["CMD", "test", "-f", "/var/log/app_logs/sample.log.ready"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s

  worker-1:
    build:
      context: .
      dockerfile: Dockerfile.worker
    depends_on:
      - master-node
    tty: true # -it option
    volumes:
      - shared_logs:/app/data:ro # read only

  worker-2:
    build:
      context: .
      dockerfile: Dockerfile.worker
    depends_on:
      - master-node
    tty: true # -it option
    volumes:
      - shared_logs:/app/data:ro # read only

# log volume
volumes:
  shared_logs: