services:
  master-node:
    build:
      context: . # directory from which we build
      dockerfile: Dockerfile
      target: master_image
    ports:
      - "60000:60000"
      - "8080:8080"
    tty: true
    environment:
      - LOGGRID_INPUT_DIR=/app/data
      - LOGGRID_OUTPUT_DIR=/data/loggrid
    volumes:
      - /data/logs:/app/data:ro
      - "/data/loggrid:/data/loggrid"

  # One definition for all workers; start several with:
  #   docker compose up -d --scale worker=4
  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: worker_image
    depends_on:
      - master-node
    tty: true # -it option
    # CPU limit per worker, e.g. LOGGRID_WORKER_CPUS=2; 0 means no limit
    cpus: ${LOGGRID_WORKER_CPUS:-0}
    volumes:
      - /data/logs:/app/data:ro # read only
