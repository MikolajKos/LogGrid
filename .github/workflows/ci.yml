name: LogGrid CI

# start condition
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Build Docker images
      run: docker compose build

    # Run tests
    - name: Build test image
      run: docker build --target test_image -t loggrid-tests .

    - name: Run GTest suite
      run: docker run --rm loggrid-tests

  # Runs on the GitHub VM instead of Docker: TSan needs lower mmap
  # randomization, which Docker's default seccomp profile does not allow
  sanitizers:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false # report both sanitizers even if one fails
      matrix:
        sanitizer: [ address, thread ]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install Ninja
      run: sudo apt-get update && sudo apt-get install -y ninja-build

    # Linux 6.x randomizes mmap more than TSan supports ("unexpected memory mapping")
    - name: Lower mmap randomization for TSan
      if: matrix.sanitizer == 'thread'
      run: sudo sysctl vm.mmap_rnd_bits=28

    - name: Configure
      run: cmake -B build -G Ninja -DLOGGRID_SANITIZER=${{ matrix.sanitizer }}

    - name: Build
      run: cmake --build build

    - name: Run tests
      run: ctest --test-dir build --output-on-failure

  coverage:
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Build coverage image
      run: docker build --target coverage_image -t loggrid-coverage .

    - name: Run coverage pipeline
      run: |
        docker run --name coverage-run loggrid-coverage
        docker cp coverage-run:/usr/src/app/build/coverage/html ./coverage-html
        docker rm coverage-run

    - name: Upload HTML coverage report
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: coverage-html/
        retention-days: 7